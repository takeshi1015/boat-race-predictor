<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ボートレース予測システム{% endblock %}</title>
  <!-- Bootstrap CSS (CDN) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    crossorigin="anonymous"
  />
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head_extra %}{% endblock %}
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-trophy-fill me-2"></i>ボートレース予測
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
              <i class="bi bi-speedometer2 me-1"></i>ダッシュボード
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/predictions/today' %}active{% endif %}" href="/predictions/today">
              <i class="bi bi-calendar-day me-1"></i>当日予想
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/predictions/tomorrow' %}active{% endif %}" href="/predictions/tomorrow">
              <i class="bi bi-calendar2-plus me-1"></i>翌日予想
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/analysis' %}active{% endif %}" href="/analysis">
              <i class="bi bi-bar-chart-line me-1"></i>分析
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/results' %}active{% endif %}" href="/results">
              <i class="bi bi-list-ol me-1"></i>結果詳細
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/settings' %}active{% endif %}" href="/settings">
              <i class="bi bi-gear me-1"></i>設定
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="container-fluid py-4">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="footer py-3 bg-light mt-auto">
    <div class="container text-center text-muted small">
      <span>ボートレース予測システム &copy; {{ 2026 }}</span>
      <span class="mx-2">|</span>
      <a href="/api-docs" class="text-muted">API ドキュメント</a>
    </div>
  </footer>

  <!-- Bootstrap JS (CDN) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>
  <!-- Chart.js (CDN) -->
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
    crossorigin="anonymous"
  ></script>
  <!-- Custom JS -->
  <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts_extra %}{% endblock %}
</body>
</html>
