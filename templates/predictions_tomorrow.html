{% extends "base.html" %}

{% block title %}翌日予想 - ボートレース予測システム{% endblock %}

{% block content %}
<div class="row mb-4 align-items-center">
  <div class="col">
    <h2 class="fw-bold"><i class="bi bi-calendar2-plus me-2 text-primary"></i>翌日予想</h2>
    <p class="text-muted mb-0" id="tomorrow-date">読み込み中…</p>
  </div>
  <div class="col-auto">
    <button id="btn-refresh" class="btn btn-outline-primary btn-sm" onclick="loadPredictions()">
      <i class="bi bi-arrow-clockwise me-1"></i>更新
    </button>
  </div>
</div>

<!-- 高信頼度予想（80%以上）-->
<div class="mb-5">
  <h3 class="fw-bold text-success mb-3">
    <i class="bi bi-check-circle-fill me-2"></i>✅ 確実性の高い予想 - 本命狙い
  </h3>
  <div id="high-confidence-cards" class="row g-3">
    <div class="col-12 text-center py-5 text-muted">
      <div class="spinner-border" role="status"></div>
      <p class="mt-2">読み込み中…</p>
    </div>
  </div>
</div>

<!-- 中信頼度予想（60-80%）-->
<div class="mb-5">
  <h3 class="fw-bold text-primary mb-3">
    <i class="bi bi-star-fill me-2"></i>⭐ 標準予想
  </h3>
  <div id="medium-confidence-cards" class="row g-3">
    <div class="col-12 text-center py-5 text-muted">
      <div class="spinner-border" role="status"></div>
      <p class="mt-2">読み込み中…</p>
    </div>
  </div>
</div>

<!-- 穴狙い予想（50-60%）-->
<div class="mb-5">
  <h3 class="fw-bold text-warning mb-3">
    <i class="bi bi-bullseye me-2"></i>💰 穴確率が高い予想 - 配当狙い
  </h3>
  <div id="low-confidence-cards" class="row g-3">
    <div class="col-12 text-center py-5 text-muted">
      <div class="spinner-border" role="status"></div>
      <p class="mt-2">読み込み中…</p>
    </div>
  </div>
</div>

<p class="text-end text-muted small">最終更新: <span id="last-updated">-</span></p>
{% endblock %}

{% block scripts_extra %}
<script>
function starsHtml(confidence) {
  const filled = Math.round(confidence * 5);
  return "⭐".repeat(filled) + "☆".repeat(5 - filled);
}

function createRaceCard(pred, category) {
  const order = (pred.predicted_order || []).join("-") || "-";
  const conf = pred.confidence || 0;
  const confPct = (conf * 100).toFixed(1);
  const raceTime = pred.race_time || "?";
  
  const card = document.createElement("div");
  card.className = "col-md-6 col-lg-4";
  
  let badgeBg, badgeText, headerBg;
  
  if (category === "high_confidence") {
    badgeBg = "bg-success";
    badgeText = "【本命】";
    headerBg = "#e8f5e9";
  } else if (category === "medium_confidence") {
    badgeBg = "bg-primary";
    badgeText = "【標準】";
    headerBg = "#e3f2fd";
  } else {
    badgeBg = "bg-warning";
    badgeText = "【穴狙い】";
    headerBg = "#fff3e0";
  }
  
  card.innerHTML = `
    <div class="card shadow-sm h-100">
      <div class="card-header d-flex justify-content-between align-items-center" style="background-color: ${headerBg}">
        <span class="fw-bold"><i class="bi bi-water me-1"></i>${pred.place || pred.venue || "不明"}競艇場</span>
        <span class="badge bg-secondary">${pred.race_number}R</span>
      </div>
      <div class="card-body">
        <!-- レース時刻 -->
        <div class="small text-muted mb-3">
          <i class="bi bi-clock me-1"></i>
          <strong>${raceTime}</strong>
        </div>
        
        <!-- 推奨買い目 -->
        <div class="text-center mb-3">
          <span class="display-6 fw-bold text-primary">${order}</span>
          <p class="text-muted small mb-0">推奨買い目</p>
        </div>
        
        <!-- 信頼度 -->
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="text-muted small">信頼度</span>
          <span class="badge ${badgeBg}">${badgeText}</span>
        </div>
        
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="text-warning">${starsHtml(conf)}</span>
          <span class="fw-bold">${confPct}%</span>
        </div>
        
        <div class="progress mb-3" style="height:8px">
          <div class="progress-bar ${badgeBg}" style="width:${confPct}%"></div>
        </div>
        
        <!-- 理由 -->
        ${pred.reason ? `
          <p class="text-muted small mb-0">
            <i class="bi bi-info-circle me-1"></i>
            ${pred.reason}
          </p>
        ` : ""}
      </div>
    </div>`;
  
  return card;
}

async function loadPredictions() {
  const highConfContainer = document.getElementById("high-confidence-cards");
  const mediumConfContainer = document.getElementById("medium-confidence-cards");
  const lowConfContainer = document.getElementById("low-confidence-cards");
  
  highConfContainer.innerHTML = `<div class="col-12 text-center py-5 text-muted"><div class="spinner-border"></div><p class="mt-2">読み込み中…</p></div>`;
  mediumConfContainer.innerHTML = `<div class="col-12 text-center py-5 text-muted"><div class="spinner-border"></div><p class="mt-2">読み込み中…</p></div>`;
  lowConfContainer.innerHTML = `<div class="col-12 text-center py-5 text-muted"><div class="spinner-border"></div><p class="mt-2">読み込み中…</p></div>`;

  try {
    const res = await fetch("/api/races/tomorrow");
    const data = await res.json();

    document.getElementById("tomorrow-date").textContent = data.date ? `${data.date}（翌日）` : "";
    document.getElementById("last-updated").textContent = new Date().toLocaleString("ja-JP");

    const predictions = data.predictions || [];

    if (predictions.length === 0) {
      highConfContainer.innerHTML = `
        <div class="col-12">
          <div class="alert alert-warning">
            <i class="bi bi-exclamation-triangle me-2"></i>
            翌日のレースデータがありません。<br>
            <code>python scripts/init_test_data.py</code> を実行してテストデータを追加してください。
          </div>
        </div>`;
      mediumConfContainer.innerHTML = "";
      lowConfContainer.innerHTML = "";
      return;
    }

    // 信頼度別に分類
    const highConf = predictions.filter(p => p.confidence >= 0.80);
    const mediumConf = predictions.filter(p => p.confidence >= 0.60 && p.confidence < 0.80);
    const lowConf = predictions.filter(p => p.confidence < 0.60);

    // 高信頼度を表示
    if (highConf.length === 0) {
      highConfContainer.innerHTML = `<div class="col-12"><div class="alert alert-info">該当する予想がありません</div></div>`;
    } else {
      highConfContainer.innerHTML = "";
      highConf.forEach(pred => {
        highConfContainer.appendChild(createRaceCard(pred, "high_confidence"));
      });
    }

    // 中信頼度を表示
    if (mediumConf.length === 0) {
      mediumConfContainer.innerHTML = `<div class="col-12"><div class="alert alert-info">該当する予想がありません</div></div>`;
    } else {
      mediumConfContainer.innerHTML = "";
      mediumConf.forEach(pred => {
        mediumConfContainer.appendChild(createRaceCard(pred, "medium_confidence"));
      });
    }

    // 穴狙いを表示
    if (lowConf.length === 0) {
      lowConfContainer.innerHTML = `<div class="col-12"><div class="alert alert-info">該当する予想がありません</div></div>`;
    } else {
      lowConfContainer.innerHTML = "";
      lowConf.forEach(pred => {
        lowConfContainer.appendChild(createRaceCard(pred, "low_confidence"));
      });
    }

  } catch (e) {
    highConfContainer.innerHTML = `<div class="col-12"><div class="alert alert-danger">データの読み込みに失敗しました: ${e.message}</div></div>`;
    console.error(e);
  }
}

document.addEventListener("DOMContentLoaded", loadPredictions);
</script>
{% endblock %}
