{% extends "base.html" %}

{% block title %}当日予想 - ボートレース予測システム{% endblock %}

{% block content %}
<div class="row mb-4 align-items-center">
  <div class="col">
    <h2 class="fw-bold"><i class="bi bi-calendar-day me-2 text-primary"></i>当日予想</h2>
    <p class="text-muted mb-0" id="today-date">読み込み中…</p>
  </div>
  <div class="col-auto">
    <button id="btn-refresh" class="btn btn-outline-primary btn-sm" onclick="loadPredictions()">
      <i class="bi bi-arrow-clockwise me-1"></i>更新
    </button>
  </div>
</div>

<!-- 高信頼度予想（80%以上）-->
<div class="mb-5">
  <h3 class="fw-bold text-success mb-3">
    <i class="bi bi-check-circle-fill me-2"></i>✅ 確実性の高い予想 - 本命狙い
  </h3>
  <div id="high-confidence-cards" class="row g-3">
    <div class="col-12 text-center py-5 text-muted">
      <div class="spinner-border" role="status"></div>
      <p class="mt-2">読み込み中…</p>
    </div>
  </div>
</div>

<!-- 穴狙い予想（50-70%）-->
<div class="mb-5">
  <h3 class="fw-bold text-warning mb-3">
    <i class="bi bi-bullseye me-2"></i>💰 穴確率が高い予想 - 配当狙い
  </h3>
  <div id="high-odds-cards" class="row g-3">
    <div class="col-12 text-center py-5 text-muted">
      <div class="spinner-border" role="status"></div>
      <p class="mt-2">読み込み中…</p>
    </div>
  </div>
</div>

<p class="text-end text-muted small">最終更新: <span id="last-updated">-</span></p>
{% endblock %}

{% block scripts_extra %}
<script>
const PURCHASE_DEADLINE_OFFSET_MS = 5 * 60 * 1000;

function starsHtml(confidence) {
  const filled = Math.round(confidence * 5);
  return "⭐".repeat(filled) + "☆".repeat(5 - filled);
}

function formatTimeRemaining(seconds) {
  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);
  return `${min}分${sec}秒`;
}

function createRaceCard(pred, category) {
  const order = (pred.predicted_order || []).join("-") || "-";
  const conf = pred.confidence || 0;
  const confPct = (conf * 100).toFixed(1);
  const isHighConfidence = category === "high_confidence";
  
  const raceDate = pred.date ? new Date(pred.date) : null;
  const computedRaceTime = raceDate && !Number.isNaN(raceDate.getTime())
    ? raceDate.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit", hour12: false })
    : "?";
  const raceTime = pred.race_time || computedRaceTime;

  const computedDeadline = raceDate && !Number.isNaN(raceDate.getTime())
    ? new Date(raceDate.getTime() - PURCHASE_DEADLINE_OFFSET_MS)
    : null;
  const deadline = pred.purchase_deadline || (
    computedDeadline
      ? computedDeadline.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit", hour12: false })
      : "?"
  );
  const deadlineIso = pred.purchase_deadline_iso || (computedDeadline ? computedDeadline.toISOString() : "");
  const timeRemaining = pred.time_remaining || 0;
  const isPurchasable = pred.is_purchasable;
  
  const card = document.createElement("div");
  card.className = "col-md-6 col-lg-4";
  
  const badgeBg = isHighConfidence ? "bg-success" : "bg-warning";
  const badgeText = isHighConfidence ? "【購入推奨】" : "【穴狙い】";
  const headerBg = isHighConfidence ? "#e8f5e9" : "#fff3e0";
  
  const statusColor = isPurchasable ? "#4CAF50" : "#999";
  const statusText = isPurchasable ? "購入可能" : "購入終了";
  
  card.innerHTML = `
    <div class="card shadow-sm h-100 race-item ${isPurchasable ? 'available' : 'expired'}" 
         data-deadline="${deadlineIso}">
      <div class="card-header d-flex justify-content-between align-items-center" style="background-color: ${headerBg}">
        <span class="fw-bold"><i class="bi bi-water me-1"></i>${pred.place || pred.venue || "不明"}競艇場</span>
        <span class="badge bg-secondary">${pred.race_number}レース</span>
      </div>
      <div class="card-body">
        <!-- レース時刻と購入制限 -->
        <div class="race-time mb-3" style="font-size: 13px; line-height: 1.8;">
          <div style="color: #666;">
            <i class="bi bi-clock text-info"></i> ⏰ レース時刻: <strong style="color: #000;">${raceTime}</strong>
          </div>
          <div style="color: #666;">
            <i class="bi bi-x-circle text-danger"></i> 🚫 購入制限: <strong style="color: #000;">${deadline}</strong>
          </div>
          <div style="color: ${statusColor}; font-weight: bold; margin-top: 4px;">
            ${statusText} 
            <span class="time-remaining">${isPurchasable ? formatTimeRemaining(timeRemaining) : "終了"}</span>
          </div>
        </div>
        
        <!-- 推奨買い目 -->
        <div class="text-center mb-3">
          <span class="display-6 fw-bold text-primary">${order}</span>
          <p class="text-muted small mb-0">推奨買い目</p>
        </div>
        
        <!-- 信頼度 -->
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="text-muted small">信頼度</span>
          <span class="badge ${badgeBg}">${badgeText}</span>
        </div>
        
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="text-warning">${starsHtml(conf)}</span>
          <span class="fw-bold">${confPct}%</span>
        </div>
        
        <div class="progress mb-3" style="height:8px">
          <div class="progress-bar ${isHighConfidence ? 'bg-success' : 'bg-warning'}" 
               style="width:${confPct}%"></div>
        </div>
        
        <!-- 理由 -->
        ${pred.reason ? `
          <p class="text-muted small mb-0">
            <i class="bi bi-info-circle me-1"></i>
            ${isHighConfidence ? '◎ ' : '△ '}${pred.reason}
          </p>
        ` : ""}
      </div>
    </div>`;
  
  return card;
}

async function loadPredictions() {
  const highConfContainer = document.getElementById("high-confidence-cards");
  const highOddsContainer = document.getElementById("high-odds-cards");
  
  highConfContainer.innerHTML = `<div class="col-12 text-center py-5 text-muted"><div class="spinner-border"></div><p class="mt-2">読み込み中…</p></div>`;
  highOddsContainer.innerHTML = `<div class="col-12 text-center py-5 text-muted"><div class="spinner-border"></div><p class="mt-2">読み込み中…</p></div>`;

  try {
    const res = await fetch("/api/races/today");
    const data = await res.json();

    document.getElementById("today-date").textContent = data.date || "";
    document.getElementById("last-updated").textContent = new Date().toLocaleString("ja-JP");

    const predictions = data.predictions || [];
    
    // 高信頼度（80%以上）
    const highConf = predictions.filter(p => p.confidence >= 0.80);
    
    // 穴狙い（50-70%、高信頼度と重複なし）
    const usedVenues = new Set(highConf.map(p => p.place || p.venue));
    const highOdds = predictions.filter(p => 
      p.confidence >= 0.50 && 
      p.confidence < 0.80 &&
      !(usedVenues.has(p.place || p.venue))
    );

    if (highConf.length === 0 && highOdds.length === 0) {
      highConfContainer.innerHTML = `<div class="col-12"><div class="alert alert-warning">当日のレースデータがありません</div></div>`;
      highOddsContainer.innerHTML = "";
      return;
    }

    // 高信頼度を表示
    if (highConf.length === 0) {
      highConfContainer.innerHTML = `<div class="col-12"><div class="alert alert-info">該当する予想がありません</div></div>`;
    } else {
      highConfContainer.innerHTML = "";
      highConf.forEach(pred => {
        highConfContainer.appendChild(createRaceCard(pred, "high_confidence"));
      });
    }

    // 穴狙いを表示
    if (highOdds.length === 0) {
      highOddsContainer.innerHTML = `<div class="col-12"><div class="alert alert-info">該当する予想がありません</div></div>`;
    } else {
      highOddsContainer.innerHTML = "";
      highOdds.forEach(pred => {
        highOddsContainer.appendChild(createRaceCard(pred, "high_odds"));
      });
    }

  } catch (e) {
    highConfContainer.innerHTML = `<div class="col-12"><div class="alert alert-danger">データ読み込みエラー: ${e.message}</div></div>`;
    console.error(e);
  }
}

// リアルタイムカウントダウン
setInterval(() => {
  document.querySelectorAll(".race-item[data-deadline]").forEach((el) => {
    const deadline = el.dataset.deadline;
    if (!deadline) return;

    const now = new Date();
    const remaining = Math.max(0, (new Date(deadline) - now) / 1000);

    // 残り時間テキストを更新
    const timeEl = el.querySelector(".time-remaining");
    if (timeEl) {
      if (remaining <= 0) {
        timeEl.textContent = "終了";
      } else {
        timeEl.textContent = formatTimeRemaining(remaining);
      }
    }

    // 状態クラスを更新
    if (remaining <= 0) {
      el.classList.add("expired");
      el.classList.remove("available");
    } else {
      el.classList.add("available");
      el.classList.remove("expired");
    }
  });
}, 1000);

document.addEventListener("DOMContentLoaded", loadPredictions);
</script>
{% endblock %}
