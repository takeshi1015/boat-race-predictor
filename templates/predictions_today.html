{% extends "base.html" %}

{% block title %}当日予想 - ボートレース予測システム{% endblock %}

{% block content %}
<div class="row mb-4 align-items-center">
  <div class="col">
    <h2 class="fw-bold"><i class="bi bi-calendar-day me-2 text-primary"></i>当日予想</h2>
    <p class="text-muted mb-0" id="today-date">読み込み中…</p>
  </div>
  <div class="col-auto">
    <button id="btn-refresh" class="btn btn-outline-primary btn-sm" onclick="loadPredictions()">
      <i class="bi bi-arrow-clockwise me-1"></i>更新
    </button>
  </div>
</div>

<!-- 購入可能な予測のバナー -->
<div id="buyable-banner" class="alert alert-success d-flex align-items-center mb-4 d-none" role="alert">
  <i class="bi bi-cash-coin fs-4 me-3"></i>
  <div>
    <strong>購入可能な予想（信頼度 70%以上）:</strong>
    <span id="buyable-count" class="ms-2 fw-bold fs-5">0件</span>
  </div>
</div>

<!-- 予想カード一覧 -->
<div id="prediction-cards" class="row g-3 mb-4">
  <div class="col-12 text-center py-5 text-muted">
    <div class="spinner-border" role="status"></div>
    <p class="mt-2">当日予想を読み込んでいます…</p>
  </div>
</div>

<p class="text-end text-muted small">最終更新: <span id="last-updated">-</span></p>
{% endblock %}

{% block scripts_extra %}
<script>
const CONFIDENCE_THRESHOLD = 0.7;

function starsHtml(confidence) {
  const filled = Math.round(confidence * 5);
  return "⭐".repeat(filled) + "☆".repeat(5 - filled);
}

function badgeClass(confidence) {
  if (confidence >= 0.8) return "bg-success";
  if (confidence >= 0.7) return "bg-primary";
  if (confidence >= 0.6) return "bg-warning text-dark";
  return "bg-secondary";
}

function labelText(confidence) {
  return confidence >= CONFIDENCE_THRESHOLD ? "購入可能" : "参考情報";
}

function raceItemClass(pred) {
  if (!pred.purchase_deadline_iso) return "tomorrow";
  const deadline = new Date(pred.purchase_deadline_iso);
  const now = new Date();
  const remaining = (deadline - now) / 1000;
  if (remaining <= 0) return "expired";
  if (remaining <= 300) return "urgent";
  return "available";
}

function purchaseStatusHtml(pred) {
  if (!pred.purchase_deadline_iso) {
    return `<span class="badge bg-primary"><span style="margin-right:4px">ℹ️</span>明日</span>`;
  }
  const deadline = new Date(pred.purchase_deadline_iso);
  const now = new Date();
  const remaining = Math.max(0, (deadline - now) / 1000);
  if (remaining <= 0) {
    return `<span class="badge bg-secondary"><span style="margin-right:4px">❌</span>購入終了</span>`;
  }
  if (remaining <= 300) {
    return `<span class="badge bg-warning text-dark"><span style="margin-right:4px">⚠️</span>急いで！</span>`;
  }
  return `<span class="badge bg-success"><span style="margin-right:4px">✅</span>購入可能</span>`;
}

function formatRemaining(seconds) {
  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);
  return `${min}分${sec}秒`;
}

async function loadPredictions() {
  const container = document.getElementById("prediction-cards");
  container.innerHTML = `<div class="col-12 text-center py-5 text-muted"><div class="spinner-border"></div><p class="mt-2">読み込み中…</p></div>`;

  try {
    const res = await fetch("/api/races/today");
    const data = await res.json();

    document.getElementById("today-date").textContent = data.date || "";
    document.getElementById("last-updated").textContent = new Date().toLocaleString("ja-JP");

    const predictions = data.predictions || [];
    const buyable = predictions.filter(p => p.is_purchasable && p.confidence >= CONFIDENCE_THRESHOLD);

    const banner = document.getElementById("buyable-banner");
    document.getElementById("buyable-count").textContent = buyable.length + "件";
    banner.classList.toggle("d-none", buyable.length === 0);

    if (predictions.length === 0) {
      container.innerHTML = `
        <div class="col-12">
          <div class="alert alert-warning">
            <i class="bi bi-exclamation-triangle me-2"></i>
            当日のレースデータがありません。<br>
            <code>python scripts/init_test_data.py</code> を実行してテストデータを追加してください。
          </div>
        </div>`;
      return;
    }

    container.innerHTML = "";
    predictions.forEach(pred => {
      const order = (pred.predicted_order || []).join("-") || "-";
      const conf = pred.confidence || 0;
      const confPct = (conf * 100).toFixed(1);
      const stateClass = raceItemClass(pred);
      const deadlineIso = pred.purchase_deadline_iso || "";
      const initialRemaining = pred.time_remaining || 0;
      const initialRemainingText = deadlineIso ? formatRemaining(initialRemaining) : "-";

      const col = document.createElement("div");
      col.className = "col-md-6 col-lg-4";
      col.innerHTML = `
        <div class="card shadow-sm h-100 race-item ${stateClass}" data-deadline="${deadlineIso}">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-bold"><i class="bi bi-water me-1"></i>${pred.place || pred.venue || "不明"}競艇場</span>
            <span class="badge bg-secondary">${pred.race_number}R</span>
          </div>
          <div class="card-body">
            <div class="race-time mb-2">
              ${pred.race_time ? `<span>⏰ レース時刻: <strong>${pred.race_time}</strong></span>` : ""}
              ${pred.purchase_deadline ? `<span>🚫 購入制限: <strong>${pred.purchase_deadline}</strong>（残り <span class="time-remaining">${initialRemainingText}</span>）</span>` : ""}
            </div>
            <div class="mb-2">${purchaseStatusHtml(pred)}</div>
            <div class="text-center mb-3">
              <span class="display-6 fw-bold text-primary">${order}</span>
              <p class="text-muted small mb-0">推奨買い目</p>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="text-muted small">信頼度</span>
              <span class="badge ${badgeClass(conf)}">${labelText(conf)}</span>
            </div>
            <div class="d-flex align-items-center gap-2 mb-2">
              <span class="text-warning">${starsHtml(conf)}</span>
              <span class="fw-bold">${confPct}%</span>
            </div>
            <div class="progress mb-3" style="height:8px">
              <div class="progress-bar ${conf >= CONFIDENCE_THRESHOLD ? 'bg-success' : 'bg-warning'}"
                   style="width:${confPct}%"></div>
            </div>
            ${pred.reason ? `<p class="text-muted small mb-0"><i class="bi bi-info-circle me-1"></i>${pred.reason}</p>` : ""}
          </div>
        </div>`;
      container.appendChild(col);
    });
  } catch (e) {
    container.innerHTML = `<div class="col-12"><div class="alert alert-danger">データの読み込みに失敗しました: ${e.message}</div></div>`;
  }
}

document.addEventListener("DOMContentLoaded", loadPredictions);
</script>
{% endblock %}
