{% extends "base.html" %}

{% block title %}当日予想 - ボートレース予測システム{% endblock %}

{% block content %}
<div class="row mb-4 align-items-center">
  <div class="col">
    <h2 class="fw-bold"><i class="bi bi-calendar-day me-2 text-primary"></i>当日予想</h2>
    <p class="text-muted mb-0" id="today-date">読み込み中…</p>
  </div>
  <div class="col-auto">
    <button id="btn-refresh" class="btn btn-outline-primary btn-sm" onclick="loadPredictions()">
      <i class="bi bi-arrow-clockwise me-1"></i>更新
    </button>
  </div>
</div>

<!-- 統計情報 -->
<div class="row mb-4">
  <div class="col-md-6">
    <div class="alert alert-info">
      <strong>📊 統計情報</strong><br>
      購入可能: <span id="available-count">-</span>件 | 購入締切間近: <span id="closing-soon-count">-</span>件
    </div>
  </div>
</div>

<!-- 高信頼度予想（80%以上）-->
<div class="mb-5">
  <h3 class="fw-bold text-success mb-3">
    <i class="bi bi-check-circle-fill me-2"></i>✅ 確実性の高い予想 - 本命狙い
  </h3>
  <div id="high-confidence-cards" class="row g-3">
    <div class="col-12 text-center py-5 text-muted">
      <div class="spinner-border" role="status"></div>
      <p class="mt-2">読み込み中…</p>
    </div>
  </div>
</div>

<!-- その他の購入可能レース -->
<div class="mb-5">
  <h3 class="fw-bold text-warning mb-3">
    <i class="bi bi-ticket-perforated me-2"></i>🎫 その他の購入可能レース
  </h3>
  <div id="high-odds-cards" class="row g-3">
    <div class="col-12 text-center py-5 text-muted">
      <div class="spinner-border" role="status"></div>
      <p class="mt-2">読み込み中…</p>
    </div>
  </div>
</div>

<!-- 購入締切間近 -->
<div class="mb-5">
  <h3 class="fw-bold text-danger mb-3">
    <i class="bi bi-alarm me-2"></i>⏳ 購入締切間近
  </h3>
  <div id="closing-soon-cards" class="row g-3">
    <div class="col-12 text-center py-3 text-muted">
      <p class="mb-0">購入締切間近のレースはありません</p>
    </div>
  </div>
</div>

<p class="text-end text-muted small">最終更新: <span id="last-updated">-</span></p>
{% endblock %}

{% block scripts_extra %}
<script>
function starsHtml(confidence) {
  const filled = Math.round(confidence * 5);
  return "⭐".repeat(filled) + "☆".repeat(5 - filled);
}

function formatTimeRemaining(seconds) {
  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);
  return `${min}分${sec}秒`;
}

function updateRaceCounts() {
  document.getElementById("available-count").textContent =
    document.querySelectorAll(".race-item.available").length;
  document.getElementById("closing-soon-count").textContent =
    document.querySelectorAll(".race-item.closing-soon").length;
}

function updateEmptyStates() {
  const highConfContainer = document.getElementById("high-confidence-cards");
  const highOddsContainer = document.getElementById("high-odds-cards");
  const closingSoonContainer = document.getElementById("closing-soon-cards");

  if (!highConfContainer.querySelector(".race-item")) {
    highConfContainer.innerHTML = `<div class="col-12"><div class="alert alert-info">購入可能な高信頼度予想がありません</div></div>`;
  }
  if (!highOddsContainer.querySelector(".race-item")) {
    highOddsContainer.innerHTML = `<div class="col-12"><div class="alert alert-info">その他の購入可能レースはありません</div></div>`;
  }
  if (!closingSoonContainer.querySelector(".race-item")) {
    closingSoonContainer.innerHTML = `<div class="col-12 text-center py-3 text-muted"><p class="mb-0">購入締切間近のレースはありません</p></div>`;
  }
}

function createRaceCard(pred, category) {
  const order = (pred.predicted_order || []).join("-") || "-";
  const conf = pred.confidence || 0;
  const confPct = (conf * 100).toFixed(1);
  const isHighConfidence = category === "high_confidence";
  const isClosingSoon = category === "closing_soon";
  
  const raceTime = pred.race_time || "?";
  const deadline = pred.purchase_deadline || "?";
  const raceDateTimeIso = pred.date || "";
  const secondsUntilRace = raceDateTimeIso
    ? Math.max(0, Math.floor((new Date(raceDateTimeIso) - new Date()) / 1000))
    : (pred.seconds_until_race || 0);
  const isPurchasable = pred.is_purchasable;
  const statusText = pred.status || (isPurchasable ? "購入可能" : "購入締切間近");
  
  const card = document.createElement("div");
  card.className = "col-md-6 col-lg-4";
  
  const badgeBg = isClosingSoon ? "bg-danger" : (isHighConfidence ? "bg-success" : "bg-warning");
  const badgeText = isClosingSoon ? "【締切間近】" : (isHighConfidence ? "【購入推奨】" : "【穴狙い】");
  const headerBg = isClosingSoon ? "#ffebee" : (isHighConfidence ? "#e8f5e9" : "#fff3e0");
  
  const statusColor = isPurchasable ? "#4CAF50" : "#d32f2f";
  
  card.innerHTML = `
    <div class="card shadow-sm h-100 race-item ${isPurchasable ? 'available' : 'closing-soon'}" 
         data-race-time="${raceDateTimeIso}">
      <div class="card-header d-flex justify-content-between align-items-center" style="background-color: ${headerBg}">
        <span class="fw-bold"><i class="bi bi-water me-1"></i>${pred.place || pred.venue || "不明"}競艇場</span>
        <span class="badge bg-secondary">${pred.race_number}レース</span>
      </div>
      <div class="card-body">
        <!-- レース時刻と購入制限 -->
        <div class="race-time mb-3" style="font-size: 13px; line-height: 1.8;">
          <div style="color: #666;">
            <i class="bi bi-clock text-info"></i> ⏰ レース時刻: <strong style="color: #000;">${raceTime}</strong>
          </div>
          <div style="color: #666;">
            <i class="bi bi-x-circle text-danger"></i> 🚫 購入制限: <strong style="color: #000;">${deadline}</strong>
          </div>
          <div style="color: ${statusColor}; font-weight: bold; margin-top: 4px;">
            <span class="status-text">${statusText}</span>
            <span class="time-remaining">${formatTimeRemaining(secondsUntilRace)}</span>
          </div>
        </div>
        
        <!-- 推奨買い目 -->
        <div class="text-center mb-3">
          <span class="display-6 fw-bold text-primary">${order}</span>
          <p class="text-muted small mb-0">推奨買い目</p>
        </div>
        
        <!-- 信頼度 -->
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="text-muted small">信頼度</span>
          <span class="badge ${badgeBg}">${badgeText}</span>
        </div>
        
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="text-warning">${starsHtml(conf)}</span>
          <span class="fw-bold">${confPct}%</span>
        </div>
        
        <div class="progress mb-3" style="height:8px">
          <div class="progress-bar ${isHighConfidence ? 'bg-success' : 'bg-warning'}" 
               style="width:${confPct}%"></div>
        </div>
        
        <!-- 理由 -->
        ${pred.reason ? `
          <p class="text-muted small mb-0">
            <i class="bi bi-info-circle me-1"></i>
            ${isHighConfidence ? '◎ ' : '△ '}${pred.reason}
          </p>
        ` : ""}
      </div>
    </div>`;
  
  return card;
}
async function loadPredictions() {
  const highConfContainer = document.getElementById("high-confidence-cards");
  const highOddsContainer = document.getElementById("high-odds-cards");
  const closingSoonContainer = document.getElementById("closing-soon-cards");
  
  highConfContainer.innerHTML = `<div class="col-12 text-center py-5 text-muted"><div class="spinner-border"></div><p class="mt-2">読み込み中…</p></div>`;
  highOddsContainer.innerHTML = `<div class="col-12 text-center py-5 text-muted"><div class="spinner-border"></div><p class="mt-2">読み込み中…</p></div>`;
  closingSoonContainer.innerHTML = `<div class="col-12 text-center py-3 text-muted"><p class="mb-0">読み込み中…</p></div>`;

  try {
    const res = await fetch("/api/races/today");
    const data = await res.json();

    document.getElementById("today-date").textContent = data.date || "";
    document.getElementById("last-updated").textContent = new Date().toLocaleString("ja-JP");

    const predictions = data.predictions || [];
    
    // 購入可能なレース（80%以上）
    const highConf = predictions.filter(p => p.confidence >= 0.80 && p.is_purchasable);
    
    // その他の購入可能レース（高信頼度と重複しない）
    const highOdds = predictions.filter(p => 
      p.confidence < 0.80 &&
      p.is_purchasable
    );
    
    const closingSoon = predictions.filter(p => p.is_closing_soon);
    
    if (highConf.length === 0 && highOdds.length === 0 && closingSoon.length === 0) {
      highConfContainer.innerHTML = `<div class="col-12"><div class="alert alert-warning">当日のレースデータがありません</div></div>`;
      highOddsContainer.innerHTML = "";
      closingSoonContainer.innerHTML = "";
      return;
    }

    // 高信頼度を表示
    if (highConf.length === 0) {
      highConfContainer.innerHTML = `<div class="col-12"><div class="alert alert-info">購入可能な高信頼度予想がありません</div></div>`;
    } else {
      highConfContainer.innerHTML = "";
      highConf.forEach(pred => {
        highConfContainer.appendChild(createRaceCard(pred, "high_confidence"));
      });
    }

    // 穴狙いを表示
    if (highOdds.length === 0) {
      highOddsContainer.innerHTML = `<div class="col-12"><div class="alert alert-info">その他の購入可能レースはありません</div></div>`;
    } else {
      highOddsContainer.innerHTML = "";
      highOdds.forEach(pred => {
        highOddsContainer.appendChild(createRaceCard(pred, "high_odds"));
      });
    }

    if (closingSoon.length === 0) {
      closingSoonContainer.innerHTML = `<div class="col-12 text-center py-3 text-muted"><p class="mb-0">購入締切間近のレースはありません</p></div>`;
    } else {
      closingSoonContainer.innerHTML = "";
      closingSoon.forEach(pred => {
        closingSoonContainer.appendChild(createRaceCard(pred, "closing_soon"));
      });
    }

    updateRaceCounts();
    updateEmptyStates();

  } catch (e) {
    highConfContainer.innerHTML = `<div class="col-12"><div class="alert alert-danger">データ読み込みエラー: ${e.message}</div></div>`;
    console.error(e);
  }
}

// リアルタイムカウントダウン
setInterval(() => {
  const closingSoonContainer = document.getElementById("closing-soon-cards");

  document.querySelectorAll(".race-item[data-race-time]").forEach((el) => {
    const raceTime = el.dataset.raceTime;
    if (!raceTime) return;

    const now = new Date();
    const remaining = Math.max(0, (new Date(raceTime) - now) / 1000);

    // 残り時間テキストを更新
    const timeEl = el.querySelector(".time-remaining");
    if (timeEl) {
      if (remaining <= 0) {
        timeEl.textContent = "開始";
      } else {
        timeEl.textContent = formatTimeRemaining(remaining);
      }
    }

    const statusEl = el.querySelector(".status-text");
    if (statusEl) {
      if (remaining <= 0) {
        statusEl.textContent = "終了";
      } else if (remaining <= 300) {
        statusEl.textContent = "購入締切間近";
      } else {
        statusEl.textContent = "購入可能";
      }
    }

    if (remaining <= 0) {
      el.closest(".col-md-6")?.remove();
    } else if (remaining <= 300) {
      const cardColumn = el.closest(".col-md-6");
      if (cardColumn && cardColumn.parentElement !== closingSoonContainer) {
        if (!closingSoonContainer.querySelector(".race-item")) {
          closingSoonContainer.innerHTML = "";
        }
        closingSoonContainer.appendChild(cardColumn);
      }
      el.classList.add("closing-soon");
      el.classList.remove("available");
    } else {
      el.classList.add("available");
      el.classList.remove("closing-soon");
    }
  });
  updateRaceCounts();
  updateEmptyStates();
}, 1000);

document.addEventListener("DOMContentLoaded", loadPredictions);
</script>
{% endblock %}
